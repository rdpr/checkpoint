name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run release:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:portable
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure
          path: test-results/
          retention-days: 7
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build candidate once
        env:
          COMMIT: ${{ github.sha }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          docker build --build-arg SOURCE_COMMIT="$COMMIT" --build-arg BUILD_VERSION="$VERSION" -t checkpoint:candidate .
      - name: Exercise Compose, backup, restore and monitoring
        run: TEST_IMAGE=checkpoint:candidate python3 ops/test-container.py
      - name: Generate dependency inventory and notices
        run: |
          docker run --rm --entrypoint npm checkpoint:candidate sbom --package-lock-only --omit=dev --sbom-format=cyclonedx | jq '.metadata.component.name = "checkpoint" | .metadata.component.type = "application"' > checkpoint-sbom.cdx.json
          docker run --rm --entrypoint cat checkpoint:candidate dist/THIRD_PARTY_LICENSES.txt > checkpoint-licenses.txt
      - name: Package the tested image
        run: docker save checkpoint:candidate | gzip > checkpoint-image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-image
          path: |
            checkpoint-image.tar.gz
            checkpoint-sbom.cdx.json
            checkpoint-licenses.txt
          compression-level: 0
          retention-days: 3
  kubernetes:
    needs: container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-image
      - run: docker load -i checkpoint-image.tar.gz
      - uses: helm/kind-action@0b5c88445f37b7e12a2ce1ecca7805b9046a74db # v1
        with:
          install_only: true
          version: v0.31.0
          kubectl_version: v1.35.0
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.20.0
      - run: helm lint deploy/kubernetes --set origin=https://checkpoint.example.com
      - run: TEST_IMAGE=checkpoint:candidate python3 ops/test-kubernetes.py
